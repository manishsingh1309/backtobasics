# Render Blueprint for Back to Basics with Big Ron
# Defines the static site service for Render deployment.

services:
  - type: web
    name: backtobasics
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # Prevent unnecessary rebuilds if documentation or markdown changes
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
        - tsconfig.node.json
        - index.html
        - render.yaml

    envVars:
      - key: VITE_SITE_URL
        value: https://backtobasics.fit
      # Optional email provider webhook / API endpoint (e.g. https://bigronjones-2ah1.onrender.com/api/newsletter)
      - key: VITE_EMAIL_WEBHOOK_URL
        sync: false
      # Optional Google Analytics 4 Measurement ID
      - key: VITE_GA_MEASUREMENT_ID
        sync: false

    routes:
      # Proxy backend newsletter and API requests to centralized Big Ron Jones Render service
      - type: rewrite
        source: /api/*
        destination: https://bigronjones-2ah1.onrender.com/api/*
      # Client-rendered SPA: rewrite all routes to index.html so deep links (/chest-day/, /privacy/) work cleanly
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Cache content-hashed static assets for 1 year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Cache images and thumbnails
      - path: /thumbnails/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /brand/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /ron/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      # Security headers matching BigRonJones ecosystem
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), interest-cohort=()
